services:
  ac-worldserver:
    environment:
      AC_SOAP_ENABLED: "1"
      AC_SOAP_IP: "0.0.0.0"
      AC_EXPANSION: "2"
      AC_MAX_PLAYER_LEVEL: "80"
      AC_GAME_TYPE: "1"
      AC_PLAYERBOTS_RANDOM_BOT_AUTOLOGIN: "1"
      AC_PLAYERBOTS_MIN_RANDOM_BOTS: "80"
      AC_PLAYERBOTS_MAX_RANDOM_BOTS: "80"
      AC_PLAYERBOTS_RANDOM_BOT_MIN_LEVEL: "1"
      AC_PLAYERBOTS_RANDOM_BOT_MAX_LEVEL: "80"
      AC_PLAYERBOTS_RANDOM_GEAR_QUALITY_LIMIT: "3"
      AC_PLAYERBOTS_AUTO_GEAR_QUALITY_LIMIT: "3"
      AC_PLAYERBOTS_ADD_CLASS_COMMAND: "1"
      AC_PLAYERBOTS_MAX_ADDED_BOTS: "39"
      AC_PLAYERBOTS_RANDOM_BOT_ACCOUNT_COUNT: "70"
      AC_PLAYERBOTS_LIMIT_GEAR_EXPANSION: "1"
    volumes:
      - ./modules:/azerothcore/modules:ro
